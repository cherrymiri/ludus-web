<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUDUS — 가벼운 장난과 설렘을 즐기는 사랑</title>
    <meta name="description" content="LUDUS — 가벼운 장난과 설렘을 즐기는 사랑" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+KR:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="stage" aria-label="LUDUS interactive claw"></div>

    <header class="title">
      <h1>LUDUS</h1>
      <span class="rule"></span>
      <p>가벼운 장난과 설렘을 즐기는 사랑</p>
    </header>

    <div id="success-line" aria-hidden="true">
      <span class="label">SUCCESS LINE</span>
    </div>
    <div id="success-text" aria-live="polite">SUCCESS</div>

    <aside class="howto" aria-label="How to play">
      <h2>HOW TO PLAY</h2>
      <ul>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="5" width="8" height="13" rx="4" />
            <path d="M3.5 11.5h2.5M3.5 11.5l1.4-1.4M3.5 11.5l1.4 1.4M20.5 11.5H18M20.5 11.5l-1.4-1.4M20.5 11.5l-1.4 1.4" />
          </svg>
          <span class="key">MOUSE MOVE</span><span class="desc">집게 좌우 이동</span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="3" width="10" height="15" rx="5" />
            <path d="M12 6v3" class="fill" />
            <path d="M12 20.5v2M12 22.5l-1.4-1.4M12 22.5l1.4-1.4" />
          </svg>
          <span class="key">SCROLL ↓</span><span class="desc">집게 내리기</span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="6" width="10" height="15" rx="5" />
            <path d="M12 9v3" class="fill" />
            <path d="M12 3.5v-2M12 1.5l-1.4 1.4M12 1.5l1.4 1.4" />
          </svg>
          <span class="key">SCROLL ↑</span><span class="desc">집게 올리기</span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="4" width="10" height="16" rx="5" />
            <path d="M12 4v6.5M7 10.5h10" />
            <path d="M12 4a5 5 0 0 0-5 5v1.5h5z" class="solid" />
          </svg>
          <span class="key">LEFT CLICK</span><span class="desc">집게 닫기 / 다시 클릭하여 열기</span>
        </li>
      </ul>
      <p class="hint">공을 성공선 위까지 들어 올려 보세요.</p>
    </aside>

    <div id="loading">LOADING</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
